# Application configuration
app.integration.openlibrary.download-enabled=true
app.integration.openlibrary.import-enabled=true
app.integration.openlibrary.process-enabled=true
# Quarkus
## Core
quarkus.virtual-threads.name-prefix=virtual-
## Rest Client
quarkus.rest-client.user-agent="github.com/mangila/library-api (olsson.erik1993@gmail.com)"
quarkus.rest-client.alpn=true
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.max-chunk-size=16K
quarkus.rest-client.enable-compression=true
quarkus.rest-client.openlibrary.url=https://openlibrary.org
quarkus.rest-client.openlibrary.disable-default-mapper=true
quarkus.rest-client.openlibrary.connect-timeout=30000
quarkus.rest-client.openlibrary.read-timeout=300000
quarkus.rest-client.openlibrary.follow-redirects=true
## Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.driver=org.postgresql.Driver
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.initial-size=1
## Flyway
quarkus.flyway.clean-disabled=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-version=1
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.table=flyway_schema_history
## Hibernate
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.jdbc.statement-batch-size=256
quarkus.hibernate-orm.jdbc.statement-fetch-size=5120
quarkus.hibernate-orm.order-inserts=true
quarkus.hibernate-orm.order-updates=true
quarkus.datasource.jdbc.additional-jdbc-properties.reWriteBatchedInserts=true
quarkus.hibernate-orm.statistics=false
quarkus.hibernate-orm.log-session-metrics=false
quarkus.hibernate-orm.scripts.generation.create-target=target/generated.sql
quarkus.hibernate-orm.scripts.generation=create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.highlight-sql=false
## JobRunr
quarkus.jobrunr.job-scheduler.enabled=true
quarkus.jobrunr.background-job-server.poll-interval-in-seconds=15
quarkus.jobrunr.background-job-server.enabled=true
quarkus.jobrunr.dashboard.enabled=true
quarkus.jobrunr.dashboard.port=9001
quarkus.jobrunr.background-job-server.thread-type=VirtualThreads
## HTTP
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=application/json,application/problem+json,application/graphql+json
### HTTP: CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4321
quarkus.http.cors.exposed-headers=x-trace-id,location
### HTTP: Problem
quarkus.http-problem.constraint-violation.title=Constraint violation
quarkus.http-problem.constraint-violation.status=422
quarkus.http-problem.include-mdc-properties=traceId
## GraphQL
quarkus.smallrye-graphql.show-runtime-exception-message=com.github.mangila.library.shared.HttpProblemException
quarkus.smallrye-graphql.events.enabled=true
## Grpc
quarkus.grpc.server.use-separate-server=false
quarkus.grpc.server.enable-reflection-service=true
## Logging
quarkus.log.console.json.enabled=false
## Health
quarkus.smallrye-health.ui.enabled=true
quarkus.smallrye-health.include-problem-details=true
## OpenApi
quarkus.swagger-ui.enabled=true
